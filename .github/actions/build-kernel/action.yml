
name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'

inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true

  page_size:
    description: 'ARM64 page size: 4k (default) or 16k'
    required: false
    type: string
    default: '4k'

  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false

runs:
  using: composite
  steps:

    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config

    # Configure 300Hz at the Kconfig level.
    - name: 'Set 300Hz Timer'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        echo "========================================"
        echo " Configuring Kernel Timer: 300Hz"
        echo "========================================"

        DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
        HZ_KCONFIG="common/kernel/Kconfig.hz"

        # Check required kernel configuration files.
        if [ ! -f "$DEFCONFIG" ]; then
          echo "ERROR: gki_defconfig not found!"
          exit 1
        fi

        if [ ! -f "$HZ_KCONFIG" ]; then
          echo "ERROR: kernel/Kconfig.hz not found!"
          exit 1
        fi

        # Confirm that this kernel supports HZ_300.
        if ! grep -q 'config HZ_300' "$HZ_KCONFIG"; then
          echo "ERROR: HZ_300 is not supported by this kernel source!"
          exit 1
        fi

        # Change the default timer frequency from 250Hz to 300Hz.
        # This also protects against configuration stages that
        # regenerate the configuration from Kconfig defaults.
        if grep -q 'default HZ_250' "$HZ_KCONFIG"; then
          sed -i '0,/default HZ_250/s/default HZ_250/default HZ_300/' "$HZ_KCONFIG"
        fi

        # Confirm the default was changed.
        if ! grep -q 'default HZ_300' "$HZ_KCONFIG"; then
          echo "ERROR: Could not set HZ_300 as the Kconfig default!"
          exit 1
        fi

        # Remove previous timer frequency selections.
        sed -i '/^[[:space:]]*CONFIG_HZ_[0-9]\+=/d' "$DEFCONFIG"
        sed -i '/^[[:space:]]*# CONFIG_HZ_[0-9]\+ is not set/d' "$DEFCONFIG"
        sed -i '/^[[:space:]]*CONFIG_HZ=/d' "$DEFCONFIG"

        # Explicitly enable 300Hz.
        echo "CONFIG_HZ_300=y" >> "$DEFCONFIG"

        echo "Updated gki_defconfig:"
        grep -E '^CONFIG_HZ' "$DEFCONFIG"

        echo "Updated Kconfig default:"
        grep -n 'default HZ_' "$HZ_KCONFIG" || true

        echo "300Hz configuration preparation completed."

    - name: 'Build Kernel'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        PAGE_SIZE="${{ inputs.page_size }}"

        sed -i 's/check_defconfig//' ./common/build.config.gki

        if [ -f "build/build.sh" ]; then

          if [ "$PAGE_SIZE" != "4k" ]; then
            echo "ERROR: page_size=${PAGE_SIZE} is only supported by the Kleaf (Bazel) build."
            exit 1
          fi

          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="/home/runner/out" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          CC="/usr/bin/ccache clang" \
          CXX="/usr/bin/ccache clang++" \
          HOSTCC="/usr/bin/ccache clang" \
          HOSTCXX="/usr/bin/ccache clang++" \
          build/build.sh -j"$(nproc)"

        else

          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel

          PAGE_SIZE_FLAGS=()

          if [ "$PAGE_SIZE" = "16k" ]; then
            PAGE_SIZE_FLAGS+=(--page_size=16k)
          fi

          tools/bazel build \
            --config=fast \
            "${PAGE_SIZE_FLAGS[@]}" \
            --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image

        fi

    - name: 'Verify Generated Kernel Configuration'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        PAGE_SIZE="${{ inputs.page_size }}"

        echo "========================================"
        echo " Verifying Generated Kernel Configuration"
        echo "========================================"

        # Locate the final generated .config.
        CONFIG_FILE=""

        for candidate in \
          bazel-bin/common/kernel_aarch64_config/out_dir/.config \
          /home/runner/out/.config; do

          if [ -f "$candidate" ]; then
            CONFIG_FILE="$candidate"
            break
          fi

        done

        if [ -z "$CONFIG_FILE" ]; then
          CONFIG_FILE="$(find bazel-bin/common /home/runner/out \
            -maxdepth 8 -type f -name .config 2>/dev/null | head -n1 || true)"
        fi

        if [ -z "$CONFIG_FILE" ]; then
          echo "ERROR: Generated .config not found!"
          exit 1
        fi

        echo "Using configuration: $CONFIG_FILE"

        # ========================================
        # VERIFY 300Hz TIMER
        # ========================================

        echo ""
        echo "--- Timer Frequency Configuration ---"

        grep -E '^CONFIG_HZ(_[0-9]+)?=' "$CONFIG_FILE" || true

        if ! grep -qx 'CONFIG_HZ_300=y' "$CONFIG_FILE"; then
          echo "ERROR: CONFIG_HZ_300 is missing!"
          echo "The kernel was NOT configured for 300Hz."
          grep -E '^(# )?CONFIG_HZ_[0-9]+' "$CONFIG_FILE" || true
          exit 1
        fi

        if ! grep -qx 'CONFIG_HZ=300' "$CONFIG_FILE"; then
          echo "ERROR: CONFIG_HZ is not 300!"
          grep '^CONFIG_HZ=' "$CONFIG_FILE" || true
          exit 1
        fi

        echo "SUCCESS: 300Hz timer verified in final .config!"

        # ========================================
        # VERIFY PAGE SIZE
        # ========================================

        echo ""
        echo "--- Page Size Configuration ---"

        grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES|^CONFIG_ARM64_PAGE_SHIFT' "$CONFIG_FILE" || true

        if [ "$PAGE_SIZE" = "16k" ]; then
          want_on="CONFIG_ARM64_16K_PAGES=y"
          want_off="# CONFIG_ARM64_4K_PAGES is not set"
        else
          want_on="CONFIG_ARM64_4K_PAGES=y"
          want_off="# CONFIG_ARM64_16K_PAGES is not set"
        fi

        if ! grep -qx "$want_on" "$CONFIG_FILE"; then
          echo "ERROR: Expected '$want_on' in $CONFIG_FILE"
          exit 1
        fi

        if ! grep -qx "$want_off" "$CONFIG_FILE"; then
          echo "ERROR: Expected '$want_off' in $CONFIG_FILE"
          exit 1
        fi

        echo "SUCCESS: ${PAGE_SIZE} page size verified!"

        # ========================================
        # VERIFY KERNELSU AND SUSFS
        # ========================================

        echo ""
        echo "--- KSU Configuration ---"

        grep -E '^#? ?CONFIG_KSU' "$CONFIG_FILE" || true

        if [ "${ROOT_IMPLEMENTATION:-}" != "" ] && \
           [ "${ROOT_IMPLEMENTATION:-}" != "none" ]; then

          if ! grep -qx 'CONFIG_KSU=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KSU missing from final .config!"
            exit 1
          fi

          if [ -n "${SUSFS_COMMIT:-}" ] && \
             ! grep -qx 'CONFIG_KSU_SUSFS=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KSU_SUSFS missing from final .config!"
            exit 1
          fi

        fi

        # ========================================
        # SUSFS IMAGE PROBE
        # ========================================

        echo ""
        echo "--- SUSFS Image Probe ---"

        for img in \
          bazel-bin/common/kernel_aarch64/Image \
          /home/runner/out/dist/Image; do

          if [ -f "$img" ]; then
            echo "susfs strings: $(grep -ac susfs "$img" || true)"
            break
          fi

        done

        echo ""
        echo "ALL KERNEL CONFIGURATION CHECKS PASSED!"

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
          echo "Found Image at bazel-bin/common/kernel_aarch64/Image"

          cp \
            "bazel-bin/common/kernel_aarch64/Image" \
            "${{ github.workspace }}/AnyKernel3/Image"

          exit 0
        fi

        if [ -f "/home/runner/out/dist/Image" ]; then
          echo "Found Image at /home/runner/out/dist/Image"

          cp \
            "/home/runner/out/dist/Image" \
            "${{ github.workspace }}/AnyKernel3/Image"

          exit 0
        fi

        echo "ERROR: Kernel Image not found!"
        exit 1
        
